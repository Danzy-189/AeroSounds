modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Danzy-189/AeroSounds/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
Realistic aerodynamic sound for moving physics contraptions:
wind rush, pass-by whooshes, transonic rumble and sonic booms,
with Doppler shift, finite speed of sound, occlusion and
distance-dependent high-frequency absorption.
Client-side only. Designed for Create: Aeronautics / Create Simulated.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_loader_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"
